<html lang="tr" translate="no" class="notranslate">
  <head>
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5QS82G2HQE');
    </script>
    <meta name="google" content="notranslate" />
    <script>
      // DOM patch to prevent React removeChild & insertBefore crashes caused by Google Translate & browser extensions
      if (typeof Node !== 'undefined' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            if (child.parentNode) {
              return child.parentNode.removeChild(child);
            }
            return child;
          }
          return originalRemoveChild.call(this, child);
        };

        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (referenceNode.parentNode) {
              return referenceNode.parentNode.insertBefore(newNode, referenceNode);
            }
            return this.appendChild(newNode);
          }
          return originalInsertBefore.call(this, newNode, referenceNode);
        };
      }

      // Suppress benign Vite WebSocket & browser extension DOM errors to prevent app crashes
      window.addEventListener('error', function(e) {
        if (e.message && (
          e.message.includes('WebSocket') || 
          e.message.includes('[vite]') ||
          e.message.includes('removeChild') ||
          e.message.includes('insertBefore') ||
          e.message.includes('Kaldırılacak düğüm') ||
          e.message.includes('NotFoundError')
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (
          String(e.reason).includes('WebSocket') || 
          String(e.reason).includes('removeChild') ||
          String(e.reason).includes('insertBefore') ||
          (e.reason.message && (
            e.reason.message.includes('WebSocket') || 
            e.reason.message.includes('[vite]') ||
            e.reason.message.includes('removeChild') ||
            e.reason.message.includes('insertBefore')
          ))
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      {
        const originalConsoleError = console.error;
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (
            args[0].includes('WebSocket') || 
            args[0].includes('[vite]') ||
            args[0].includes('removeChild') ||
            args[0].includes('insertBefore')
          )) return;
          originalConsoleError.apply(console, args);
        };
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/images/ON-Logo.png" />
    <title>FocusON Akademi</title>
    <link rel="icon" type="image/png" href="/images/ON-Logo.png" />
    <script>
      let originalOnError;
      Object.defineProperty(window, 'onerror', {
        get() { return originalOnError; },
        set(val) {
          if (typeof val === 'function') {
            originalOnError = function(msg, src, ln, col, err) {
              if (
                msg === 'Script error.' || 
                msg === 'Script error' || 
                (typeof msg === 'string' && (msg.includes('removeChild') || msg.includes('insertBefore') || msg.includes('NotFoundError')))
              ) return true;
              return val(msg, src, ln, col, err);
            };
          } else {
            originalOnError = val;
          }
        }
      });
      
      {
        const originalConsoleError = console.error;
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('removeChild') || args[0].includes('insertBefore'))) return;
          originalConsoleError.apply(console, args);
        };
      }
      
      {
        const originalConsoleLog = console.log;
        console.log = function(...args) {
          if (typeof args[0] === 'string' && args[0].includes('[vite]')) return;
          originalConsoleLog.apply(console, args);
        };
      }

      window.addEventListener('error', function(e) {
        if (
          e.message === 'Script error.' || 
          e.message === 'Script error' || 
          !e.filename ||
          (e.message && (e.message.includes('removeChild') || e.message.includes('insertBefore') || e.message.includes('NotFoundError')))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
